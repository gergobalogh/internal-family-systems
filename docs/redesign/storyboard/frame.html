<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- One storyboard frame at phone size, drawn from the app's own art.
     Open as frame.html?f=A08; render all with render.mjs. Frames live in frames.js. -->
<style>
  :root {
    --ink: #3a3340;
    --ink-soft: #5e5566;
    --display: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    --ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; background: #000; }
  .phone { position: relative; width: 390px; height: 844px; overflow: hidden; font-family: var(--ui); color: var(--ink); }
  .scene { position: absolute; inset: 0; transform-origin: 0 0; }
  .world { position: absolute; top: 0; height: 844px; width: 1512px; left: -818px; background-size: 1512px 844px; }
  .light { position: absolute; width: 260px; height: 70px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 246, 214, .75), rgba(255, 246, 214, 0)); transform: translate(-50%, -50%); }
  .fig { position: absolute; transform: translateX(-50%); }
  .fig img { display: block; width: 100%; }
  .fig.mirror img { transform: scaleX(-1); }
  .fig.dim { filter: saturate(.5) blur(1.2px); opacity: .55; }
  .fig.ring::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: 2%; height: 16%;
    border: 2px solid rgba(255, 252, 240, .95); border-radius: 50%; box-shadow: 0 0 14px rgba(255, 240, 200, .9); }
  .fig.glow img { filter: drop-shadow(0 0 22px rgba(255, 210, 130, 1)) drop-shadow(0 0 60px rgba(255, 196, 110, .8)); }
  .tag { position: absolute; left: 50%; transform: translateX(-50%); top: calc(100% - 6px); white-space: nowrap;
    background: rgba(255, 251, 246, .9); border-radius: 10px; padding: 3px 9px 4px; font-weight: 600; font-size: 13px;
    box-shadow: 0 2px 8px rgba(58, 51, 64, .12); }
  .tag small { display: block; font-weight: 400; font-style: italic; font-family: var(--display); font-size: 12px; color: var(--ink-soft); white-space: normal; width: 170px; text-align: center; }
  .bubble { position: absolute; transform: translate(-50%, -100%); width: max-content; max-width: 220px; padding: 10px 14px;
    background: #fffaf2; border-radius: 18px; font-family: var(--display); font-style: italic; font-size: 16px; line-height: 1.3;
    box-shadow: 0 6px 18px rgba(58, 51, 64, .18); text-align: center; border: 2px dashed rgba(201, 138, 94, .45); }
  .bubble::after { content: ''; position: absolute; left: var(--tail, 30%); bottom: -9px; width: 16px; height: 16px; background: #fffaf2;
    transform: rotate(45deg); border-right: 2px dashed rgba(201, 138, 94, .45); border-bottom: 2px dashed rgba(201, 138, 94, .45); }
  .handle { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--ink-soft); transform: translate(-50%, -50%); }

  .card { position: absolute; left: 16px; right: 16px; padding: 20px 22px 18px; border-radius: 20px; text-align: center;
    border: 1.5px solid rgba(255, 252, 246, .9); outline: 1px solid rgba(201, 138, 94, .4); outline-offset: -8px;
    background: rgba(255, 250, 242, .55); backdrop-filter: blur(10px) saturate(1.1); box-shadow: 0 10px 30px rgba(58, 51, 64, .1); }
  .card.ghosted { opacity: .35; }
  .card.slim { padding: 14px 18px 12px; }
  .card p { font-family: var(--display); font-size: 16px; line-height: 1.45; }
  .card p + p { margin-top: 10px; }
  .card p.soft { color: var(--ink-soft); font-size: 14px; }
  .field { margin-top: 14px; height: 40px; border: 1.5px solid rgba(58, 51, 64, .3); border-radius: 12px; background: rgba(255, 252, 248, .7); }
  .field.tall { height: 64px; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
  .btn { font: 500 14px var(--ui); padding: 8px 18px; border-radius: 999px; border: 1.5px solid rgba(58, 51, 64, .25); background: rgba(255, 252, 248, .75); }
  .btn.main { background: #3a3340; color: #fff; border-color: #3a3340; }
  .btn.chip { font-family: var(--display); font-size: 15px; }
  .whisper { position: absolute; left: 24px; right: 24px; text-align: center; font-family: var(--display); font-size: 19px; color: #fff;
    text-shadow: 0 1px 10px rgba(40, 30, 50, .7); }
  .float { position: absolute; transform: translate(-50%, -50%); font: 500 12px var(--ui); padding: 5px 11px; border-radius: 999px;
    background: rgba(255, 251, 246, .9); box-shadow: 0 2px 10px rgba(58, 51, 64, .15); white-space: nowrap; }
  .float.door { background: rgba(58, 51, 64, .85); color: #fff; }
  .undo { position: absolute; top: 14px; left: 14px; }

  .postcard { position: absolute; left: 30px; right: 30px; top: 120px; background: #fffaf2; padding: 12px 12px 16px; border-radius: 6px;
    box-shadow: 0 16px 40px rgba(40, 30, 50, .35); transform: rotate(-2.5deg); }
  .postcard .pic { position: relative; height: 270px; overflow: hidden; border-radius: 3px; }
  .postcard .pic .world { height: 270px; width: 484px; left: -150px; background-size: 484px 270px; }
  .postcard .cap { font-family: var(--display); font-size: 14px; line-height: 1.4; margin-top: 10px; color: var(--ink); }
  .postcard .cap em { color: var(--ink-soft); }
  .postcard .date { font: 12px var(--ui); color: var(--ink-soft); margin-top: 6px; text-align: right; }
  .veil { position: absolute; inset: 0; background: linear-gradient(rgba(60, 40, 70, .1), rgba(60, 40, 70, .35)); }
</style>
</head>
<body>
<div class="phone" id="phone"></div>
<script src="frames.js"></script>
<script>
  const ASSET = '../../../src/assets/'
  const f = FRAMES.find((x) => x.id === new URLSearchParams(location.search).get('f'))
  const phone = document.getElementById('phone')
  const el = (cls, html = '', style = '') => {
    const d = document.createElement('div')
    d.className = cls
    d.innerHTML = html
    if (style) d.style.cssText = style
    return d
  }
  function figure(p, parent) {
    const box = p.size
    const flags = ['mirror', 'dim', 'ring', 'glow'].filter((k) => p[k]).join(' ')
    const d = el('fig ' + flags)
    d.style.width = box + 'px'
    d.style.left = p.x + 'px'
    // The figure art stands on row 612 of its 640 px box.
    d.style.top = p.y - box * (612 / 640) + 'px'
    d.innerHTML = `<img src="${ASSET}figures/figure-${p.look}.webp">`
    if (p.name && !p.noTag) d.appendChild(el('tag', `${p.name}${p.under ? `<small>${p.under}</small>` : ''}`))
    parent.appendChild(d)
    if (p.handle) parent.appendChild(el('handle', '', `left:${p.x + box * 0.33}px;top:${p.y - 4}px`))
  }
  const world = (parent, dusk) =>
    parent.appendChild(el('world', '', `background-image:url(${ASSET}world/world-${dusk ? 'dusk' : 'day'}-1600.webp)`))

  // The scene (world, light, parts), optionally framed closer: the camera.
  const scene = el('scene')
  world(scene, f.dusk)
  if (f.light !== false) scene.appendChild(el('light', '', 'left:150px;top:640px'))
  for (const p of f.parts ?? []) figure(p, scene)
  if (f.zoom) {
    const [cx, cy, k] = f.zoom
    scene.style.transform = `translate(${195 - cx * k}px, ${f.zoomY ?? 600 - cy * k}px) scale(${k})`
  }
  phone.appendChild(scene)
  for (const b of f.bubbles ?? []) phone.appendChild(el('bubble', b.text, `left:${b.x}px;top:${b.y}px;--tail:${b.tail ?? '30%'}`))
  for (const t of f.floats ?? []) phone.appendChild(el('float' + (t.door ? ' door' : ''), t.text, `left:${t.x}px;top:${t.y}px`))
  if (f.veil) phone.appendChild(el('veil'))
  if (f.postcard) {
    const pc = el('postcard')
    const pic = el('pic')
    world(pic, f.postcard.dusk)
    for (const p of f.postcard.parts) figure(p, pic)
    pc.append(pic, el('cap', f.postcard.caption), el('date', f.postcard.date))
    phone.appendChild(pc)
  }
  if (f.whisper) phone.appendChild(el('whisper', f.whisper.text, `top:${f.whisper.y}px`))
  if (f.undo) phone.appendChild(el('undo btn', '↶ Undo'))
  if (f.card) {
    const c = f.card
    const card = el('card' + (c.ghosted ? ' ghosted' : '') + (c.slim ? ' slim' : ''), '', c.bottom != null ? `bottom:${c.bottom}px` : `top:${c.top ?? 40}px`)
    card.innerHTML =
      (c.lines ?? []).map((l) => (l.startsWith('~') ? `<p class="soft">${l.slice(1)}</p>` : `<p>${l}</p>`)).join('') +
      (c.chips ? `<div class="row">${c.chips.map((x) => `<span class="btn chip">${x}</span>`).join('')}</div>` : '') +
      (c.field ? `<div class="field${c.field === 'tall' ? ' tall' : ''}"></div>` : '') +
      (c.buttons ? `<div class="row">${c.buttons.map((b) => `<span class="btn${b.startsWith('*') ? ' main' : ''}">${b.replace(/^\*/, '')}</span>`).join('')}</div>` : '')
    phone.appendChild(card)
  }
</script>
</body>
</html>
